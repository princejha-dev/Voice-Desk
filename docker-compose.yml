version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: voicedesk-api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  runtime:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.runtime
    container_name: voicedesk-runtime
    restart: always
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: voicedesk-redis
    restart: always
    volumes:
      - redis_data:/data

volumes:
  redis_data:
